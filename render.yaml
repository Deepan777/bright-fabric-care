# Optional one-click blueprint for Render.com.
# The database itself is no longer Render's free Postgres (it hit the free
# 30-day expiry) — it's now a Neon Postgres database. DATABASE_URL is set
# manually in the Render dashboard (Environment tab) and marked sync: false
# below so Render's blueprint sync never overwrites it back to a Render-
# managed database.
services:
  - type: web
    name: bright-fabric-care-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
